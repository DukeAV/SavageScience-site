
<!DOCTYPE html>
<html lang="en">

<head>

  <!-- BASIC CONFIGURATION -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111317">

  <!-- SEARCH ENGINE OPTIMIZATION -->
  <title>Savage Science | Primal Drive. Scientific Discipline.</title>

  <meta
    name="description"
    content="Savage Science is a performance-focused brand built on primal drive, scientific discipline, and the pursuit of progress. Rage. Control. Results."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://savagescience.co/"
  >

  <!-- OPEN GRAPH: FACEBOOK AND SOCIAL SHARING -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Savage Science">
  <meta property="og:locale" content="en_US">

  <meta
    property="og:title"
    content="Savage Science | Rage. Control. Results."
  >

  <meta
    property="og:description"
    content="Primal Drive. Scientific Discipline."
  >

  <meta
    property="og:url"
    content="https://savagescience.co/"
  >

  <!-- X / TWITTER SHARING -->
  <meta name="twitter:card" content="summary">

  <meta
    name="twitter:title"
    content="Savage Science | Rage. Control. Results."
  >

  <meta
    name="twitter:description"
    content="Primal Drive. Scientific Discipline."
  >

  <!-- STRUCTURED DATA: BRAND IDENTITY -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Brand",
    "name": "Savage Science",
    "url": "https://savagescience.co/",
    "slogan": "Rage. Control. Results.",
    "description": "A performance-focused brand driven by primal ambition and scientific discipline."
  }
  </script>

  <!-- STYLESHEET -->
  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- MAIN LANDING PAGE -->
  <main class="landing">

    <div class="landing-content">

      <!-- BRAND LOGO -->
      <header class="brand">

        <h1>
          <img
            src="assets/images/logo-savage-science-amber.png"
            alt="Savage Science"
            class="brand-logo"
          >
        </h1>

      </header>

      <!-- BRAND PHILOSOPHY -->
      <section
        class="philosophy"
        aria-label="Brand philosophy"
      >

        <p class="tagline">
          RAGE &rarr; CONTROL &rarr; RESULTS
        </p>

        <p class="subtitle">
          PRIMAL DRIVE. SCIENTIFIC DISCIPLINE.
        </p>

      </section>

      <!-- SOCIAL MEDIA LINKS -->
      <nav
        class="social-links"
        aria-label="Official social media accounts"
      >

        <a
          href="https://www.facebook.com/REPLACE-WITH-YOUR-PAGE"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Savage Science on Facebook"
        >
          Facebook
        </a>

        <a
          href="https://www.instagram.com/REPLACE-WITH-YOUR-PAGE"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Savage Science on Instagram"
        >
          Instagram
        </a>

        <a
          href="https://www.youtube.com/@REPLACE-WITH-YOUR-CHANNEL"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Savage Science on YouTube"
        >
          YouTube
        </a>

      </nav>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer">

    <small>
      &copy; 2026 Savage Science. All rights reserved.
    </small>

  </footer>

</body>

</html>
